# TorchServe config for the W1 baseline. Tune workers for the W4 concurrency comparison
# (each worker is a separate process — exposes the VRAM-per-worker cost noted in REVISION-PLAN).
inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082
# number_of_netty_threads / job_queue_size left at defaults; set per experiment and record in meta.
# default_workers_per_model controls process-level parallelism (TorchServe's analogue of pool size):
default_workers_per_model=1
