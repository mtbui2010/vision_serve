# CI — build, vet, gofmt, test + cross-build edge/arm64.
# LƯU Ý: binding yalue/onnxruntime_go nạp libonnxruntime.so lúc RUNTIME (purego/dlopen),
# nên build/vet/test KHÔNG cần ONNX Runtime. Unit test không chạy inference thật.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build · Vet · Fmt · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt (chặn file chưa format)
        run: |
          # Bỏ qua .claude/ (worktree cục bộ của agent); trên CI thư mục này không có .go nên
          # tập file giống hệt `gofmt -l .`. Cùng tập file với `make fmt`.
          unformatted="$(gofmt -l $(find . -path ./.claude -prune -o -name '*.go' -print))"
          if [ -n "$unformatted" ]; then
            echo "Các file chưa gofmt:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee go-test.log

      # Job logs need a login to read; annotations are public, so surface the failures there.
      - name: Annotate test failures
        if: failure()
        run: |
          grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:' go-test.log | head -40 |
            while IFS= read -r line; do echo "::error::${line}"; done

  mermaid:
    name: Mermaid diagrams parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # GitHub and the docs site render ```mermaid blocks; a parse error shows up only as an
      # "Unable to render" box, so parse them all here (the README once shipped a broken one).
      - run: npm install --no-save --no-package-lock mermaid@11 jsdom@24
      - run: node website/tools/check_mermaid.mjs .

  cross-build-edge:
    name: Cross-build edge (linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      # Binding yalue/onnxruntime_go dùng cgo (ORT C API). Cross-build arm64 PHẢI bật
      # CGO_ENABLED=1 + cross-compiler aarch64; nếu CGO=0 (mặc định khi cross) sẽ báo
      # "build constraints exclude all Go files".
      - name: Cài cross toolchain aarch64
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build arm64 (Jetson target)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '1'
          CC: aarch64-linux-gnu-gcc
        run: go build ./...
