# Publish the VisionServe Python client (clients/python) to PyPI / TestPyPI using
# PyPI Trusted Publishing (OIDC) — no API tokens stored in the repo.
#
#   - Push a tag  py-vX.Y.Z    -> publish to PyPI         (real release)
#   - Run manually (dispatch)  -> publish to TestPyPI     (dry run / staging)
#
# The client has its own tag prefix: the SDK version (visionserve/__init__.py) and the server
# version (internal/cli/root.go, Docker Hub tags) move independently, and a plain v* tag would
# also start the server's Docker workflow. Tags v0.1.0-v0.1.5 are older client releases.
#
# ONE-TIME SETUP (on pypi.org and test.pypi.org → your account → Publishing):
#   Add a "Trusted Publisher" for project `visionserve` with:
#     Owner/Repository: mtbui2010/vision_serve
#     Workflow name:    pypi.yml
#     Environment:      pypi        (for PyPI)   /   testpypi (for TestPyPI)
#   The tag must equal __version__ in clients/python/visionserve/__init__.py (the build job
#   checks it); PyPI rejects re-uploading an existing version.
name: Publish Python client

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/py-v')
        working-directory: clients/python
        run: |
          want="${GITHUB_REF_NAME#py-v}"
          have=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('visionserve/__init__.py').read()).group(1))")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but __version__ = $have"; exit 1; }
      - name: Build sdist + wheel
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: clients/python/dist/

  publish-testpypi:
    # Manual runs go to TestPyPI (safe staging).
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    # Tag pushes (py-v*) go to the real PyPI.
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
