# Generated by `visionserve pull rf-detr-nano` — do not hand-edit blindly.
# RF-DETR nano (COCO) — smallest/fastest RF-DETR variant, 384×384 input, ~23 ms on GPU.
name: rf-detr-nano
task: detection
license: Apache-2.0
architecture: rf-detr
source_url: https://huggingface.co/PierreMarieCurie/rf-detr-onnx/resolve/main/rf-detr-nano.onnx
# sha256 = the LFS oid of rf-detr-nano.onnx on PierreMarieCurie/rf-detr-onnx (checked against
# the HF tree API, 107 816 789 bytes) and of the local file below (input [1,3,384,384]).
sha256: 3fcbba0f68bad4939fdf1c38f432783b95691e2869af3be369780aa5be67abb2
# The local name is the catalog's LocalFilename for this entry (internal/catalog/catalog.go),
# which `pull` writes: the bytes are the NANO export despite the "base" in the name (the real
# base weights are models/rf-detr/rf-detr-base-real.onnx, sha b3321965…). Renaming it here
# alone would break re-pulls; rename it in the catalog entry and here together.
model_file: rf-detr-base.onnx

input:
  width: 384
  height: 384
  layout: NCHW
  # Squash, as RF-DETR is trained (square_resize_div_64) — BUGS_TO_FIX.md #1. Measured
  # 2026-10-05 (CPU, ORT 1.26) with `visionserve check rf-detr-nano --checkpoint
  # ~/.roboflow/models/rf-detr-nano.pth --images <200 COCO val2017> --labels <their instances
  # json>` against the official checkpoint run by rfdetr itself (mAP 44.09 at conf 0.5):
  #   letterbox: true   B1 46.6 gray levels, B2 31/36 boxes, mAP 40.92 (-3.16)  FAIL
  #   letterbox: false  B1  0.4 gray levels, B2 38/38 boxes, mAP 43.80 (-0.29)  PASS
  letterbox: false
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

postprocess:
  type: detr
  box_format: cxcywh
  conf_threshold: 0.5
  max_detections: 300

labels: coco91.txt

runtime:
  prefer: [cuda, cpu]
  idle_unload_seconds: 300
