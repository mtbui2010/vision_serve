# EXPERIMENTAL — NOT RECOMMENDED. Use `rfdetr-gdino-etri` instead for open-vocabulary detection.
#
# This is the single-pass "dual head" architecture: RF-DETR proposes boxes once, a supervised
# closed head names known words, and SigLIP-crop names the rest by cropping the box and
# embedding it. It was built to avoid a second detection pass. Measured head-to-head against
# the hybrid router (rfdetr-gdino-etri) on the held-out-names protocol — 5 names never seen by
# a 17-class RF-DETR, evaluated against real ground truth, so genuinely unseen classes:
#
#     system                                17-trained mAP   5-held-out mAP   latency
#     this model, shipped config                    84.60            15.77     84 ms
#     this model, best case (impractical)            ~85.0           35.54       —
#     rfdetr-gdino-etri (hybrid router)              82.62            49.54    338 ms
#
# The router wins by +33.8 mAP on genuinely novel classes at every operating point tried. The
# root cause is structural, not a tuning gap: RF-DETR has no dedicated binary objectness head,
# so its objectness proxy (max over its own trained-class logits) is 27x weaker for unseen
# objects than trained ones (median 0.033 vs 0.891, measured) — no matter which head does the
# NAMING, the detector's own confidence still gates whether a detection survives at all.
# GroundingDINO does not inherit this bias: it is a one-stage, text-conditioned detector whose
# confidence is computed with the query already in the loop, not borrowed from a closed
# classifier. See rfdetr-gdino-etri/manifest.yaml for the recommended path.
#
# Kept in the registry for reference and because it IS a real latency win (84ms vs 338ms) if a
# future scoring fix (a genuinely class-agnostic objectness source) closes the accuracy gap.
#
#   closed head  the detector's OWN supervised 22-class head, for the words it was trained on.
#                On those names a supervised head beats head B by 16 points (FINDINGS §8), and
#                `method: dual` measured +16.1 mAP over `gated` for exactly this reason.
#   open head    SigLIP-crop, for everything else: crop the box, embed it, compare against the
#                requested words. On five names held out of every trained component SigLIP-crop
#                scores 85.3 where head B scores 46.7 — head B loses to running the teacher.
#                That offline number is on GIVEN boxes; it does not survive the detector's own
#                objectness gate, which is what the table above measures.
#
# The router reads text and dispatches; it detects nothing. Declaring files.crop is what selects
# SigLIP-crop over head B as the open head — without it this model is `rfdetr-textalign-dec1`.
#
# WHY THE CROP HEAD IS A SECOND PASS. It reads pixels, ~1.4 ms per crop batched. Naming all 300
# object queries would cost ~420 ms against a 20 ms detector, so unclaimed queries are marked,
# survive postprocess on the detector's own objectness, and only the 3-15 that get through are
# cropped — in ONE batched call.
name: rfdetr-dualhead-dec1
task: open_vocab
license: Apache-2.0
architecture: rfdetr-textalign

files:
  rfdetr: detector.onnx                    # dec1, exports query_feats
  text:   ../siglip-text/model.onnx        # SigLIP text tower — MUST match the crop tower
  crop:   ../siglip-image/model.onnx       # SigLIP vision tower: the open head

# proj.bin is the SigLIP-distilled projection (d_text 768). The crop head does not use it, but
# textalign loads it and validates the text tower's width against its d_text, so it must be the
# SigLIP-dimension one — a CLIP projection (512) fails to load against a 768-wide tower.

input:
  width: 512
  height: 512
  layout: NCHW
  letterbox: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

postprocess:
  type: detr
  box_format: cxcywh
  # THIS THRESHOLD DECIDES WHETHER THE OPEN HEAD RUNS AT ALL, which is not obvious and is not
  # local to this block. For a prompt covering the base vocabulary the closed head's claim score
  # IS the objectness — both are the max over the same class logits — so anything surviving
  # conf_threshold automatically clears claim_threshold (default 0.15) and the closed head takes
  # every detection. At 0.35 this model returned a stream byte-identical to the plain closed
  # detector: the crop head was loaded, resident in VRAM, and dead.
  #
  # 0.05 keeps it reachable. It is below the 0.15 default claim, so a box can survive selection
  # and still be declined by the closed head.
  #
  # The cost of the lower threshold is real but small at this operating point: measured, held-out
  # objects sit at median objectness 0.033 against 0.891 for trained ones, a 27x gap, so a
  # threshold tuned for trained classes discards essentially every unseen object. 7.6% of
  # held-out ground truth clears 0.35; 96.6% of trained ground truth does.
  conf_threshold: 0.05
  max_detections: 300

labels: labels.txt

runtime:
  prefer: [tensorrt, cuda, cpu]
  idle_unload_seconds: 300
