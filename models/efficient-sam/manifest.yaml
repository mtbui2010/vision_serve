# EfficientSAM — promptable segmentation, Apache-2.0. Two-session PipelineModel.
# Needs a PROMPT (box/point): `visionserve run efficient-sam img.jpg --box x,y,w,h`.
# Weights are NOT committed — see README.md to download the ONNX files.
name: efficient-sam
task: segmentation
license: Apache-2.0
architecture: efficient-sam

# Two ONNX sessions (roles): encoder → decoder (I/O verified on these files).
source_url: https://huggingface.co/yunyangx/EfficientSAM/
sha256:
  encoder: 84ed466ffcc5c1f8d08409bc34a23bb364ab2c15e402cb12d4335a42be0e0951
  decoder: a62f8fa5ea080447c0689418d69e58f1e83e0b7adf9c142e2bd9bcc8045c0b11

files:
  encoder: efficient_sam_encoder.onnx
  decoder: efficient_sam_decoder.onnx

input:
  # Go feeds the ORIGINAL-size image as NCHW pixel/255; the encoder GRAPH resizes to
  # 1024x1024 and ImageNet-normalizes itself (verified by graph inspection), so no
  # normalize block here. width/height are informational only.
  width: 1024
  height: 1024
  layout: NCHW
  letterbox: false

postprocess:
  type: sam        # output_masks already at original res; threshold logit >= 0; column-major RLE

runtime:
  prefer: [cuda, cpu]
  idle_unload_seconds: 300
