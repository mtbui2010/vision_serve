# Generated by `visionserve pull rfdetr-gdino-sam` — do not hand-edit blindly.
# Hybrid router + MobileSAM masks — RF-DETR/GroundingDINO boxes → one mask per box.
name: rfdetr-gdino-sam-etri
task: open_vocab
license: Apache-2.0
architecture: rfdetr-gdino

files:
  decoder: ../mobile-sam/mobile_sam_decoder_single.onnx
  encoder: ../mobile-sam/mobile_sam_encoder.onnx
  gdino: ../grounding-dino/model-fixedmask.onnx
  rfdetr: ../rfdetr-small-etri/model.onnx

input:
  width: 512
  height: 512
  layout: NCHW
  letterbox: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

postprocess:
  type: detr
  box_format: cxcywh
  conf_threshold: 0.5
  max_detections: 300

labels: ../rfdetr-small-etri/labels.txt

# NO explain block, deliberately.
#
# files.rfdetr now resolves to pf-full, which does not emit `cross_attn_weights` — that missing
# tensor is why it is ~19 ms faster (it was a 59 MB device->host copy the detect path never read).
#
# The previous weights survive next door as ../rfdetr-small-etri/model-explain.onnx and DO carry
# the attention, so pointing `explain.role` at them would make /api/explain "work". It would also
# be a lie: those are DIFFERENT WEIGHTS, not the same graph with an extra output, so the heatmap
# would explain a model other than the one that produced the detections — and it would look
# perfectly plausible while doing so. An unavailable feature is better than a convincing wrong one.
#
# To get attention back, serve ../rfdetr-small-etri/model-explain.onnx as its own model and accept
# its lower accuracy, or re-export pf-full with the attention output.

runtime:
  prefer: [tensorrt, cuda, cpu]
  idle_unload_seconds: 300
