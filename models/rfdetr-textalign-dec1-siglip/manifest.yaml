# Text-aligned open-vocabulary detection, distilled from SigLIP on a MIXED image pool.
# Architecture "rfdetr-textalign" (internal/models/textalign), method "gated".
#
#   name(query i)  = argmax_c ⟨W_c, f_i⟩,  W = a·T̂P  [C, 256]   <- head B, folded
#   score(query i) = sigmoid( max_c logit_c^detector )           <- the detector's own head
#
# WHAT IS DIFFERENT FROM ../rfdetr-textalign-dec1
#
# Two changes, neither of them to the head's architecture, and both measured before being made
# (paper/FINDINGS-2026-08.md §9–§10):
#
#  1. THE TEACHER. Head B is a student of whatever produced its distillation targets and cannot
#     beat it on words it has never seen. On 5 names held out of every trained component,
#     SigLIP-crop scores 85.3 against CLIP-crop's 65.3 — so the teacher, not the student, was the
#     ceiling. P is therefore 768×256 here, not 512×256. The serving code needed no change:
#     d_text is a field of proj.bin, exercised at 512/768/1152 in textalign/dim_test.go.
#  2. THE PICTURES. A head distilled only on COCO crops scores 46.7 on those held-out names;
#     distilled on in-domain crops, 69.3. But distilled ONLY in-domain it collapses to 20.5 macro
#     on COCO — the same lesson in the other direction. The shipped head mixes both pools.
#
# Result on the 17-class held-out backbone (ETRI held-out images / COCO val2017):
#
#             ETRI base 17   ETRI unseen 5   COCO top1   COCO macro
#   this      81.6           57.3            85.0        78.3
#   CLIP-crop 72.4           65.3            57.7        66.4
#   SigLIP-crop (teacher)    78.8   85.3     58.5        73.7
#
# It is above CLIP-crop on three of four columns, and its COCO macro is above the SigLIP
# teacher's own — at one matmul against a ViT per crop.
#
# CHOOSING BETWEEN THE TWO SHIPPED PROJECTIONS
#   proj.bin            n_coco 2000, dis_mix prop      the general default (the table above)
#   proj-openvocab.bin  n_coco 5000, dis_mix balanced  ETRI unseen 64.0, base 78.1, COCO macro
#                                                      72.2 — prefer it when unseen-name accuracy
#                                                      matters more than COCO breadth
# Swap by renaming; the loader reads proj.bin. The ratio matters more than the amount: the same
# proportional weighting at 10 000 images lets COCO outweigh ETRI 20:1 and unseen names fall to
# 48.0.
#
# LICENSE: RF-DETR export Apache-2.0, SigLIP text tower Apache-2.0 (confirmed from the model card
# via the Hub API). Both permissive, both inside the CLAUDE.md allowlist.
#
# WEIGHTS ARE NOT COMMITTED. detector.onnx is the 17-class held-out fine-tune with query_feats
# appended LAST; see ../rfdetr-textalign-dec1/README.md for the surgery and why the output order
# is load-bearing.
name: rfdetr-textalign-dec1-siglip
task: open_vocab
license: Apache-2.0
architecture: rfdetr-textalign

files:
  rfdetr: detector.onnx
  text:   ../siglip-text/model.onnx
  # ENABLED: method "exact" (the default when a request names no method) runs on ONNX Runtime
  # instead of scalar Go. head.onnx is proj.bin exported as a graph. It is NOT committed (*.onnx
  # is gitignored) and NOT on the HF catalog, so generate it once per checkout, from the repo root:
  #
  #   python3 models/rfdetr-textalign-dec1-siglip/export_head_onnx.py
  #
  # Served, whole request, median: GPU (CUDA EP) ~62-73 -> ~25-41 ms (two runs). CPU ~134 ms (Go) -> ~121 ms with
  # `threads: {head: 1}`, but ~354 ms with ORT's default threads: the head itself is ~1 ms, and a
  # default spinning thread pool next to the detector's slows the detector ~3x. Outputs are
  # identical on CPU (max |dconf| 4.9e-7). Re-export whenever proj.bin changes; a stale head.onnx
  # is refused per request. Without head.onnx on disk the model does not load: to fall back to the
  # Go head (same outputs), comment out this line AND the `threads:` block under runtime: below
  # (one without the other is a load error / a slowdown).
  head:   head.onnx

input:
  width: 512
  height: 512
  layout: NCHW
  letterbox: false     # squash, as RF-DETR is trained (square_resize_div_64) — BUGS_TO_FIX.md #1
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

postprocess:
  type: detr
  box_format: cxcywh

  # Under the default method "gated" the thresholded quantity is sigmoid of the DETECTOR's own
  # class logit, not head B's score, so this is a detector threshold — but NOT the usual 0.5.
  # This backbone was fine-tuned with the encoder and box head frozen, so its logits sit low.
  # 0.35 is the value tuned for the sibling model on held-out images (F1 0.768); it has NOT been
  # re-tuned for this detector, which has 17 classes rather than 22.
  #
  # RE-RUN scratchpad/dec1_deploy/threshold_gated.py before trusting this number in production.
  conf_threshold: 0.35
  max_detections: 300

# MUST be the DETECTOR's own label file, 17 base names + "N/A", in the detector's order.
# Method "gated" both indexes this list to find the background column AND matches its length
# against the class tensor's width (18 here) to locate that tensor at all — a 22-name file makes
# classLogits fail to find the head, which is how this was caught.
#
# So the no-prompt fallback vocabulary is the 17 base names. The 5 names the detector was never
# fine-tuned on are exactly what a PROMPT is for, and vocab-all22.txt is kept here as the
# convenience list to paste:
#
#   visionserve run rfdetr-textalign-dec1-siglip img.png --prompt "$(paste -sd'. ' vocab-all22.txt)."
labels: labels.txt

runtime:
  prefer: [cuda, cpu]
  idle_unload_seconds: 300
  # Goes together with files.head (above). The head is ~1 ms on one thread; ORT's default pool
  # for it slows the detector on CPU (see the files.head comment). No effect on outputs.
  threads:
    head: 1
