name: clip
architecture: clip
task: embed
license: MIT
model_file: model.onnx

input:
  width: 224
  height: 224
  layout: NCHW
  letterbox: false
  normalize:
    mean: [0.48145466, 0.4578275, 0.40821073]
    std:  [0.26862954, 0.26130258, 0.27577711]

postprocess:
  type: embed

runtime:
  prefer: [tensorrt, cuda, cpu]
  idle_unload_seconds: 300
