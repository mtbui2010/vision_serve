# RF-DETR small (ETRI 22-class) — same weights as models/rfdetr-small-etri, re-exported
# with ONE EXTRA OUTPUT: query_feats [1,300,256], the per-object-query decoder features
# feeding the class head. Apache-2.0, exported by VisionForge.
#
# WHY: a text-aligned ("open-vocabulary") head has to attach to those 256-d features.
# The shipped export only emits dets/labels, so there is nothing to attach to.
#
# EQUIVALENCE (verified, not assumed): on real ETRI images this graph reproduces
# models/rfdetr-small-etri/model.onnx with max|delta| == 0.0 on dets, labels AND
# cross_attn_weights, and labels == query_feats @ class_embed.weight.T + bias to 0.0 error.
# So it is a drop-in superset: detection and /api/explain behave identically.
#
# OUTPUT ORDER MATTERS. internal/models/rfdetr/postprocess.go takes the first output whose
# last dim == 4 as the boxes and the FIRST REMAINING one as the class logits. query_feats
# must therefore stay AFTER labels — emitted before it, it would be silently mistaken for
# the logits. Order here: dets, labels, cross_attn_weights, query_feats.
#
# Reproduce: vision_forge/scripts/export_onnx_rfdetr_queryfeats.py
name: rfdetr-small-etri-qf
task: detection
license: Apache-2.0
architecture: rf-detr
model_file: model.onnx

# Binds this manifest's license claim to these exact bytes. Fill source_url in once the
# weights are published (see README.md) so `visionserve pull` can fetch them.
sha256:
  model: 5d87e22067458c9af1f679a8eeb85588569a84881a060ac0f1d8f8f252379818

input:
  width: 512
  height: 512
  layout: NCHW
  letterbox: false     # squash, as RF-DETR is trained (square_resize_div_64) — BUGS_TO_FIX.md #1
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

postprocess:
  type: detr
  box_format: cxcywh
  conf_threshold: 0.5
  max_detections: 300

labels: labels.txt

explain:
  type: attention
  outputs:
    attention: cross_attn_weights
  spatial_stride: 16

runtime:
  prefer: [cuda, cpu]
  idle_unload_seconds: 300
