name: efficientnet-b0
model_file: model.onnx
architecture: efficientnet
task: classification
license: Apache-2.0

input:
  width: 224
  height: 224
  layout: NCHW
  letterbox: false
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

postprocess:
  type: classification
  max_detections: 5

labels: imagenet1k.txt

runtime:
  prefer: [tensorrt, cuda, cpu]
  idle_unload_seconds: 300
