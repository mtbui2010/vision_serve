# Hybrid RF-DETR + GroundingDINO + MobileSAM (Apache-2.0). Same router as `rfdetr-gdino`,
# plus a MobileSAM mask per detected box (Grounded-SAM style): text → boxes → masks.
#   - prompt empty OR every requested class ∈ RF-DETR's COCO vocabulary → RF-DETR boxes,
#   - any out-of-vocabulary class → GroundingDINO boxes,
#   then MobileSAM segments each box.
# Run: `visionserve run rfdetr-gdino-sam img.jpg --prompt "person. dog."`
#
# Same `architecture: rfdetr-gdino` factory — the encoder+decoder roles below switch on the
# mask stage automatically. Weights are REUSED from the three model dirs via relative paths.
# vocab.txt is resolved next to files.gdino (../grounding-dino/vocab.txt).
name: rfdetr-gdino-sam
task: open_vocab
license: Apache-2.0
architecture: rfdetr-gdino

# Four ONNX graphs by role, referenced from the sibling model directories.
files:
  rfdetr:  ../rf-detr/rf-detr-base-real.onnx
  gdino:   ../grounding-dino/model-fixedmask.onnx
  encoder: ../mobile-sam/mobile_sam_encoder.onnx
  decoder: ../mobile-sam/mobile_sam_decoder_single.onnx

# RF-DETR preprocessing/postprocess values (GroundingDINO + MobileSAM preprocess themselves).
input:
  width: 560
  height: 560
  layout: NCHW
  letterbox: false     # squash, as RF-DETR is trained (square_resize_div_64) — BUGS_TO_FIX.md #1
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

postprocess:
  type: detr
  box_format: cxcywh
  conf_threshold: 0.5
  max_detections: 300

labels: ../rf-detr/coco91.txt

# EXECUTION PROVIDER: cuda, NOT tensorrt (owner's decision, 29 Sep 2026: every model moved to
# [cuda, cpu]). The figures quoted above are CUDA figures, and TensorRT does not reproduce them on
# the open branch. Re-measured 29 Sep 2026, served, held-out-names protocol (247 images, 17 trained
# / 5 held-out names), letterbox: false, same weights, entries identical except runtime.prefer:
#
#     prefer                  17-trained   5-held-out   median latency
#     [cuda, cpu]                  89.75        49.54         177.7 ms   <- this manifest
#     [tensorrt, cuda, cpu]        89.90        42.59         117.6 ms
#
# TensorRT is 1.5x faster and 6.95 mAP worse on the open (GroundingDINO) branch; both providers
# return the same boxes, scored and labelled differently (ovd-edge/docs/FINDINGS.md §7b). Those
# rows were taken with the protocol's own 17-name detector; the open-branch gap is GroundingDINO's.
runtime:
  prefer: [cuda, cpu]
  idle_unload_seconds: 300
