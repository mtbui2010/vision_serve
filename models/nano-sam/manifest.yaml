# NanoSAM — NVIDIA edge-optimized SAM (ResNet-18 encoder), MIT license.
# Prompted, two-session model (PipelineModel). Needs a box/point prompt.
# Faster than MobileSAM on TensorRT EP; designed for Jetson.
# Weights NOT committed — see README.md to get ONNX files.
name: nano-sam
architecture: nano-sam
task: segmentation
license: MIT

# Two ONNX graphs (roles).
# The encoder is a standard torchvision ResNet-18 export:
#   input  "input"             [1, 3, 1024, 1024] NCHW float32, ImageNet-normalized
#                              (normalization NOT baked — Go must normalize before ORT)
#   output "image_embeddings"  [1, 256, 64, 64]
# The decoder is the standard SAM decoder (same tensor names as MobileSAM decoder):
#   inputs: image_embeddings, point_coords, point_labels, mask_input,
#           has_mask_input, orig_im_size
#   outputs: masks [1,M,H,W], iou_predictions [1,M]
# TODO: verify tensor names against real ONNX files before production use.
files:
  encoder: nanosam_encoder.onnx
  decoder: nanosam_decoder.onnx

input:
  width: 1024
  height: 1024
  layout: NCHW

postprocess:
  type: sam        # mask threshold = logit > 0; mask encoded as column-major RLE

runtime:
  prefer: [tensorrt, cuda, cpu]
  idle_unload_seconds: 300
