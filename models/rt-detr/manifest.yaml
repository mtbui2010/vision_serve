name: rt-detr
architecture: rt-detr
task: detection
license: Apache-2.0
input:
  width: 640
  height: 640
  layout: NCHW
  letterbox: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
postprocess:
  type: rt-detr
  box_format: cxcywh
  conf_threshold: 0.5
  max_detections: 300
labels: coco80.txt
runtime:
  prefer: [tensorrt, cuda, cpu]
  idle_unload_seconds: 300
