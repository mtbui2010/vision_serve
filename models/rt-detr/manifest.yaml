name: rt-detr
architecture: rt-detr
task: detection
license: Apache-2.0
# Weights are not tracked. The HF export this targets (onnx-community/RT-DETR-l-hf)
# returns 401 since 2026-08-18, so `visionserve pull rt-detr` cannot fetch it; place a
# manually obtained export here (see README.md). Until then the model lists as missing.
model_file: model.onnx
input:
  width: 640
  height: 640
  layout: NCHW
  # Squash to 640x640 and scale to [0, 1], NO mean/std: what RT-DETR is trained and evaluated
  # with (RTDetrImageProcessor: size 640x640, do_normalize false; the original repos' eval
  # transforms: Resize [640, 640] + ToTensor, and Paddle's keep_ratio False + mean 0 / std 1).
  # This manifest used to letterbox with ImageNet mean/std. Measured 2026-10-05 (CPU, ORT 1.26)
  # with `visionserve check` on the first 200 COCO val2017 images by id, using the only RT-DETR
  # weights available locally as a stand-in (PekingU/rtdetr_r50vd exported by `visionserve convert
  # hf`; RT-DETR-l-hf is gone) against transformers' own pipeline (mAP 50.40 at conf 0.5):
  #   letterbox + ImageNet mean/std  B1 68.9 gray levels, B2 4/39 boxes, mAP 7.16 (-43.25)  FAIL
  #   squash, mean 0 / std 1         B1  0.2 gray levels, B2 41/41 boxes, mAP 50.34 (-0.06)  PASS
  letterbox: false
  normalize:
    mean: [0, 0, 0]
    std: [1, 1, 1]
postprocess:
  type: rt-detr
  box_format: cxcywh
  conf_threshold: 0.5
  max_detections: 300
labels: coco80.txt
runtime:
  prefer: [cuda, cpu]
  idle_unload_seconds: 300
