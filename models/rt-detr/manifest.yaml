name: rt-detr
architecture: rt-detr
task: detection
license: Apache-2.0
# Weights are not tracked. The HF export this targets (onnx-community/RT-DETR-l-hf)
# returns 401 since 2026-08-18, so `visionserve pull rt-detr` cannot fetch it; place a
# manually obtained export here (see README.md). Until then the model lists as missing.
model_file: model.onnx
input:
  width: 640
  height: 640
  layout: NCHW
  letterbox: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
postprocess:
  type: rt-detr
  box_format: cxcywh
  conf_threshold: 0.5
  max_detections: 300
labels: coco80.txt
runtime:
  prefer: [cuda, cpu]
  idle_unload_seconds: 300
